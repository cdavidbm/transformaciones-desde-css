<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios JS</title>
</head>
<body>
    <h1 id="textoParaOcultar">Este texto se va a ocultar</h1>
    <button onclick="ocultarTexto()">Ocultar Texto</button>
    <script>
        function ocultarTexto() {
            var elemento = document.getElementById('textoParaOcultar');
            elemento.style.display = 'none';
        }
    </script>
</body>
</html>
