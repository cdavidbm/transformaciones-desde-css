<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios JS</title>
</head>
<body>
    <h1 id="textoParaMostrar" style="display:none;">Este texto estaba oculto</h1>
    <button onclick="mostrarTexto()">Mostrar Texto</button>
    <script>
        function mostrarTexto() {
            var elemento = document.getElementById('textoParaMostrar');
            elemento.style.display = 'block';
        }
    </script>
</body>
</html>
