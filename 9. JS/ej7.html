<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios JS</title>
</head>
<body>
    <h1 onmouseover="cambiarTexto(this)" onmouseout="restaurarTexto(this)">Pasa el mouse sobre mí</h1>
    <script>
        function cambiarTexto(elemento) {
            elemento.innerText = "¡Magia!";
        }
        function restaurarTexto(elemento) {
            elemento.innerText = "Pasa el mouse sobre mí";
        }
    </script>
</body>
</html>
